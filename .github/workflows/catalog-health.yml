name: Catalog health

on:
  pull_request:
    paths:
      - catalog.yaml
      - src/skills/**
      - package.json
      - yarn.lock
      - .github/workflows/catalog-health.yml
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: catalog-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate catalog skills
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn skills-wizard skill validate --catalog
